name: Publish

on:
    push:
        branches: [main]
        # Narrowed from '**/package.json' to package manifests only: a real
        # release signal is a version edit under packages/<pkg>/package.json.
        # Root/devDep manifest churn (dependabot, tooling) must NOT start the
        # OIDC-minting publish job. (Sapper M2 H1 / STALE-4.)
        paths:
            - 'packages/*/package.json'

jobs:
    # Is this push actually a release? The trigger cannot tell.
    #
    # `paths: packages/*/package.json` is a proxy for "a version changed", and it is
    # not the same thing — dependabot edits package manifests too, so its merges match
    # the filter, change no version, and still raise a full OIDC approval request for a
    # run that would publish nothing. Measured 2026-08-26: SEVEN such runs (six
    # dependabot merges on 08-24, cancelled by hand; one echo-string edit in #220).
    # The comment on the path filter above already promises dependabot churn will not
    # start this job; the filter cannot keep that promise, so this job keeps it instead.
    #
    # The real cost is not minutes. A standing queue of pending approvals trains the
    # approver to wave them through, on the repository that mints publish credentials
    # for the whole fleet.
    #
    # FAILS CLOSED: every uncertain answer resolves to publishable, so a registry
    # outage costs one needless approval prompt and can never silently skip a release.
    # See scripts/detect-publishable.mjs.
    detect:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            publishable: ${{ steps.check.outputs.publishable }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 24
            # No `npm ci` — the script is zero-dependency by design, and installing the
            # tree to decide whether to do anything would defeat the point.
            - id: check
              run: node scripts/detect-publishable.mjs

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 24
            - run: npm ci --ignore-scripts
            - run: npm run build
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: build-output
                  path: packages/*/dist/
                  # 90 (the GitHub maximum), NOT the runtime of a green pipeline.
                  # 'publish' below sits behind the 'npm-publish' environment gate,
                  # which is wall-clock unbounded — a human approves when a human
                  # approves. Sizing retention against pipeline runtime coupled two
                  # unrelated clocks: at retention-days:1 any release approved more
                  # than 24h after merge lost its input. Fired live 2026-07-27
                  # (WR-0615, ui-inputs 0.10.1 — merged 07-24, approved 07-27,
                  # publish died on 'Artifact not found for name: build-output').
                  # Retention is the FIRST line of defence; the rebuild fallback in
                  # 'publish' is the second, so expiry can never block a release.
                  retention-days: 90
                  if-no-files-found: error

    publish:
        needs: [build, detect]
        # The approval request itself is the thing being gated. A skipped job raises no
        # deployment review, so nothing reaches a human unless there is a real release.
        #
        # Conditioned on `!= 'false'`, NOT on `== 'true'`, and that asymmetry is the whole
        # guarantee. `== 'true'` treats every way of not hearing an answer — `detect`
        # crashing, its output write throwing, the runner dying mid-step — as "nothing to
        # publish", which silently drops a real release and reports success doing it. Only
        # a POSITIVE "nothing to do" may suppress this job; absence must publish. The
        # explicit `needs.build.result == 'success'` restores the gate that `!cancelled()`
        # removes: an unpublishable build must still block, and only that.
        if: ${{ !cancelled() && needs.build.result == 'success' && needs.detect.outputs.publishable != 'false' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Environment gate: the OIDC mint (id-token: write) is fronted by the
        # 'npm-publish' deployment environment, whose protection rule (required
        # reviewer / wait timer) gates the token mint behind a human/policy
        # checkpoint. (Sapper M2 H1 / STALE-4.)
        environment: npm-publish
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
                  scope: '@script-development'
            # Soft download. The artifact is the PREFERRED input (build-once: the
            # bytes a reviewer approved are the bytes that publish), but it must
            # never be a hard dependency — see the rebuild step below.
            - id: fetch-build
              continue-on-error: true
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: build-output
                  path: packages
            - run: npm ci --ignore-scripts
            # Second line of defence. If the artifact is gone — expired, or purged
            # from storage — rebuild from the same pinned commit + lockfile this job
            # already checked out, rather than failing. The recovery is automatic
            # BECAUSE the manual one is not discoverable: the obvious "Re-run failed
            # jobs" re-runs 'publish' alone against the same absent artifact and
            # fails identically; only "Re-run ALL jobs" works, and nothing in
            # 'Artifact not found' says so. That ambiguity cost three days (WR-0615).
            #
            # The message names the CAUSE (approval delay) rather than the symptom.
            - name: Rebuild — build artifact unavailable (approval-delay recovery)
              if: steps.fetch-build.outcome != 'success'
              env:
                  MERGED_AT: ${{ github.event.head_commit.timestamp }}
              run: |
                  set -euo pipefail
                  # Cosmetic: this only shapes the warning text. Never let a bad or
                  # absent timestamp abort the step under `set -e` — the release is
                  # the point, the message is the courtesy.
                  # The -n test is load-bearing: GNU `date -d ''` SUCCEEDS (it reads
                  # as today's midnight), so an empty timestamp would otherwise
                  # report a plausible-looking but fabricated delay.
                  delay='an unknown interval (no usable push timestamp on this event)'
                  if [ -n "${MERGED_AT:-}" ] && merged_epoch=$(date -u -d "$MERGED_AT" +%s 2>/dev/null); then
                    elapsed=$(( $(date -u +%s) - merged_epoch ))
                    delay="$(( elapsed / 86400 ))d $(( (elapsed % 86400) / 3600 ))h $(( (elapsed % 3600) / 60 ))m"
                  fi
                  echo "::warning title=Build artifact unavailable — rebuilding::APPROVAL DELAY, not a broken build. The 'build-output' artifact from the build job could not be downloaded. This release was approved ${delay} after the commit landed on main, which outlived the artifact's retention window (or the artifact was deleted). Publishing waits on the 'npm-publish' environment approval, which has no time limit, while build artifacts expire on a fixed clock — the two are unrelated. Rebuilding from commit ${GITHUB_SHA}, the same commit and the same pinned lockfile the build job used. No manual re-run is required."
                  npm run build
            # Pre-publish dist validation, on whichever path produced packages/*/dist —
            # downloaded or rebuilt. Shares scripts/validate-dist.mjs with the PR-time
            # gate in ci.yml — single source of truth, so the release-time and PR-time
            # assertions cannot drift. Refuses to publish empty or incomplete tarballs
            # (fs-http 0.1.1/0.1.2 empty-tarball class).
            - run: npm run validate:dist
            # Its git tags stay in this runner's clone. The `tags` job below makes the
            # remote ones.
            - run: npx changeset publish
              env:
                  NPM_CONFIG_PROVENANCE: 'true'
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # One annotated `<name>@<version>` tag per version the registry records as published
    # from this commit (scripts/release-tags.mjs). A job of its own so that every re-run
    # reaches it: "Re-run all jobs" after a failed tag push skips `publish`, because
    # `detect` then finds every version on the registry, and this job still runs. It
    # needs no approval and no id-token: it reads the registry and pushes tags.
    tags:
        needs: [publish]
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 41
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
              with:
                  node-version: 24
            - name: Push release tags
              run: node scripts/release-tags.mjs
              env:
                  PUBLISH_RESULT: ${{ needs.publish.result }}
                  GIT_COMMITTER_NAME: 'github-actions[bot]'
                  GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
